[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spoofable"
version = "0.1.0"
description = "Measure whether an organization can be impersonated over email"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Alex Williams" }]
keywords = ["dmarc", "spf", "email-security", "dns", "spoofing"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "License :: OSI Approved :: MIT License",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
spoofable = "spoofable.cli:main"

[project.urls]
Homepage = "https://github.com/alexwilldev/spoofable"

[tool.setuptools.packages.find]
include = ["spoofable*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
